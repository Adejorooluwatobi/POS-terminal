<div class="modal-overlay" *ngIf="isOpen" (click)="closeModal()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-title">
        <span class="icon">💳</span>
        Gift Card Sale
      </div>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>

    <div class="modal-body" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <!-- Left: Manual Entry / New -->
      <div class="card-display">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="card-number-label" style="margin-bottom:0;">Card Details</div>
          <button class="btn btn-secondary btn-xs" (click)="generateNewCard()">Generate New</button>
        </div>
        <input 
          type="text" 
          [(ngModel)]="cardNumber" 
          class="card-number-input mono" 
          placeholder="GC-00000000"
          style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 1.1rem; text-align: center; margin-bottom: 10px;">
        
        <div class="input-group">
          <label>PIN (Cashier can set custom)</label>
          <input 
            type="text" 
            [(ngModel)]="pin" 
            placeholder="4-digit PIN"
            class="pin-input mono">
        </div>

        <div class="input-group">
          <label>Load Amount (₦)</label>
          <input 
            type="number" 
            [(ngModel)]="amount" 
            placeholder="0.00"
            class="amount-input">
        </div>
      </div>

      <!-- Right: Pick from Existing -->
      <div style="display:flex;flex-direction:column;border-left:1px solid var(--border);padding-left:20px;">
        <div class="card-number-label">Pick from Portal Cards</div>
        <div style="position:relative;margin-bottom:10px;">
          <input type="text" [(ngModel)]="searchTerm" class="inp" placeholder="Search cards..." style="padding-left:30px;font-size:12px;">
          <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);">🔍</span>
        </div>

        <div style="flex:1;max-height:200px;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;">
          @if (isLoading()) {
            <div style="text-align:center;padding:20px;font-size:11px;color:var(--text3);">Loading cards...</div>
          } @else {
            @for (c of activeCards(); track c.id) {
              @if (!searchTerm() || c.cardNumber.includes(searchTerm())) {
                <div (click)="selectCard(c)" 
                     class="card-item-select"
                     style="padding:8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all 0.2s;">
                  <span class="mono" style="font-size:12px;">{{ c.cardNumber }}</span>
                  <span style="font-size:11px;font-weight:700;color:var(--accent);">₦{{ c.balance }}</span>
                </div>
              }
            }
          }
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button 
        class="btn btn-primary" 
        (click)="onAddToCart()" 
        [disabled]="amount() <= 0">
        Add to Cart
      </button>
    </div>
  </div>
</div>
