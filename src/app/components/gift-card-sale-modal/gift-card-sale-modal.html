<div class="modal-overlay" *ngIf="isOpen" (click)="closeModal()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-title">
        <span class="icon">💳</span>
        Gift Card Sale
      </div>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="card-display">
        <div class="card-number-label">Card Number (Scan or Type)</div>
        <input 
          type="text" 
          [(ngModel)]="cardNumber" 
          class="card-number-input mono" 
          style="width: 100%; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 4px; font-size: 1.2rem; text-align: center; margin-bottom: 10px;">
        <div class="card-pin-display">System Generated PIN: {{ pin() }}</div>
      </div>

      <div class="input-group">
        <label>PIN (Cashier can set custom)</label>
        <input 
          type="text" 
          [(ngModel)]="pin" 
          placeholder="4-digit PIN"
          class="pin-input mono">
      </div>

      <div class="input-group">
        <label>Load Amount (₦)</label>
        <input 
          type="number" 
          [(ngModel)]="amount" 
          placeholder="0.00"
          class="amount-input">
      </div>

      <div class="info-note">
        This card will be activated once the payment is completed.
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button 
        class="btn btn-primary" 
        (click)="onAddToCart()" 
        [disabled]="amount() <= 0">
        Add to Cart
      </button>
    </div>
  </div>
</div>
