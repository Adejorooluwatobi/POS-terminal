<div class="w-[64px] hover:w-[180px] group transition-all duration-300 ease-in-out border-r border-[var(--border)] bg-[var(--surface)] flex flex-col h-full z-50 overflow-hidden shrink-0">
  
  <!-- Logo section -->
  <div class="p-[16px_14px] border-b border-[var(--border)] overflow-hidden">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-[var(--accent)] flex items-center justify-center text-xs font-extrabold text-[#000] shrink-0">R</div>
      <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        <div class="text-[13px] font-bold text-[var(--text)] whitespace-nowrap">RetailOS</div>
        <div class="mono text-[9px] text-[var(--text3)] whitespace-nowrap">POS Terminal</div>
      </div>
    </div>
  </div>

  <!-- Main Nav -->
  <nav class="flex-1 p-[10px_8px] flex flex-col gap-1">
    <div *ngFor="let item of navItems" 
         [routerLink]="item.route"
         routerLinkActive="bg-[var(--accent-dim)] text-[var(--accent)] border-[var(--accent)]"
         class="flex items-center gap-3 p-[10px] rounded-lg cursor-pointer transition-all duration-150 text-[var(--text2)] hover:bg-[var(--surface2)] hover:text-[var(--text)] border border-transparent">
      
      <div class="w-6 h-6 flex items-center justify-center shrink-0">
        <!-- Dashboard/Monitor icon -->
        <svg *ngIf="item.icon === 'monitor'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <!-- History icon -->
        <svg *ngIf="item.icon === 'history'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        <!-- Users icon -->
        <svg *ngIf="item.icon === 'users'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        <!-- Box icon -->
        <svg *ngIf="item.icon === 'box'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
        <!-- Chart icon -->
        <svg *ngIf="item.icon === 'chart'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <!-- Settings icon -->
        <svg *ngIf="item.icon === 'settings'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </div>
      
      <span class="text-[12px] font-semibold whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200">{{ item.label }}</span>
    </div>
  </nav>

  <!-- Bottom actions -->
  <div class="p-[10px_14px] border-t border-[var(--border)] overflow-hidden">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-8 h-8 rounded-full bg-[var(--surface2)] border border-[var(--border)] flex items-center justify-center text-[10px] font-bold text-[var(--accent)] shrink-0">
        {{ auth.currentStaff()?.initials || '??' }}
      </div>
      <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        <div class="text-[11px] font-semibold text-[var(--text)] whitespace-nowrap">{{ (auth.currentStaff()?.name ?? '').split(' ')[0] || 'Unknown' }}</div>
        <div class="text-[9px] text-[var(--text3)] whitespace-nowrap">{{ auth.currentStaff()?.role || 'Staff' }}</div>
      </div>
    </div>
    
    <button (click)="logout()" class="flex items-center gap-3 w-full p-[8px_4px] text-[var(--text3)] hover:text-[var(--red)] transition-colors duration-150">
      <div class="w-6 h-6 flex items-center justify-center shrink-0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <span class="text-[11px] font-semibold opacity-0 group-hover:opacity-100 transition-opacity duration-200">Logout</span>
    </button>
  </div>

</div>
