<div class="flex flex-col gap-2 h-full min-h-0 select-none">
  
  <!-- Keypad Surface Container -->
  <div class="bg-surface-container-low border border-surface-container-high p-2.5 rounded-xl shadow-lg flex flex-col gap-2">
    
    <!-- Override Buffer Display -->
    <div class="flex items-center justify-between px-1">
      <span class="font-label-code-md text-[10px] uppercase text-on-surface-variant font-medium tracking-wider">Qty / Amount Override</span>
      <span class="font-label-code-md text-caption text-primary font-semibold">
        {{ pos.numBuffer() || '--' }}
      </span>
    </div>

    <!-- 3x4 Capacitive Tactile Keypad -->
    <div class="grid grid-cols-3 gap-1">
      <button (click)="onKeyClick('7')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">7</button>
      <button (click)="onKeyClick('8')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">8</button>
      <button (click)="onKeyClick('9')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">9</button>
      
      <button (click)="onKeyClick('4')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">4</button>
      <button (click)="onKeyClick('5')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">5</button>
      <button (click)="onKeyClick('6')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">6</button>
      
      <button (click)="onKeyClick('1')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">1</button>
      <button (click)="onKeyClick('2')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">2</button>
      <button (click)="onKeyClick('3')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">3</button>
      
      <button (click)="onClear()" class="h-9 sm:h-9.5 rounded-lg bg-surface-container-highest/60 hover:bg-surface-container-highest text-error font-caption uppercase font-semibold flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer border border-surface-container-highest">CLR</button>
      <button (click)="onKeyClick('0')" class="h-9 sm:h-9.5 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface font-label-numeric-keypad text-body-md font-normal flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer">0</button>
      <button (click)="onBackspace()" class="h-9 sm:h-9.5 rounded-lg bg-surface-container-highest/60 hover:bg-surface-container-highest text-on-surface flex items-center justify-center active:scale-95 transition-all shadow-sm cursor-pointer border border-surface-container-highest">
        <span class="material-symbols-outlined text-[17px]" style="width:17px;height:17px;">backspace</span>
      </button>
    </div>

    <!-- POS Quick Action Pills (2x2 Grid) -->
    <div class="grid grid-cols-2 gap-1 pt-0.5">
      <button (click)="onApplyQty()" class="h-8 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-primary font-body-md text-[11px] font-medium flex items-center justify-center gap-1 active:scale-95 transition-all cursor-pointer">
        <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">add_circle</span>
        <span>Set Qty</span>
      </button>
      <button (click)="onManualDiscount()" class="h-8 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-secondary font-body-md text-[11px] font-medium flex items-center justify-center gap-1 active:scale-95 transition-all cursor-pointer">
        <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">percent</span>
        <span>Disc %</span>
      </button>
      <button (click)="onPromoCode()" class="h-8 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-tertiary font-body-md text-[11px] font-medium flex items-center justify-center gap-1 active:scale-95 transition-all cursor-pointer">
        <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">loyalty</span>
        <span>Promo</span>
      </button>
      <button (click)="onHold()" class="h-8 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-on-surface-variant font-body-md text-[11px] font-medium flex items-center justify-center gap-1 active:scale-95 transition-all cursor-pointer">
        <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">pause_circle</span>
        <span>Hold TX</span>
      </button>
    </div>

  </div>

  <!-- Session Telemetry & Operational Analytics -->
  <div class="bg-surface-container-low border border-surface-container-high p-2 rounded-xl shadow-lg space-y-1 mt-auto">
    <div class="flex items-center justify-between pb-0.5">
      <span class="font-label-code-md text-[10px] text-on-surface-variant uppercase tracking-wider font-medium">Shift Telemetry</span>
      <span class="font-label-code-md text-[10px] text-secondary font-medium">{{ tillBadge() }}</span>
    </div>

    <!-- Stat Metrics -->
    <div class="grid grid-cols-2 gap-1.5">
      <div class="p-1.5 bg-surface-container-lowest border border-surface-container-high rounded-lg">
        <span class="font-caption text-[10px] text-on-surface-variant block">Cart Total Items</span>
        <span class="font-label-code-md text-caption text-primary font-semibold">{{ pos.cart().length }}</span>
      </div>
      <div class="p-1.5 bg-surface-container-lowest border border-surface-container-high rounded-lg">
        <span class="font-caption text-[10px] text-on-surface-variant block">Shift Volume</span>
        <span class="font-label-code-md text-caption text-secondary font-semibold">{{ formattedShiftVolume() }}</span>
      </div>
    </div>

    <!-- Contactless Device Card -->
    <div class="p-1.5 bg-surface-container-lowest border border-surface-container-high rounded-lg flex items-center justify-between">
      <div class="flex items-center gap-1.5">
        <span class="material-symbols-outlined text-secondary text-[14px]" style="width:14px;height:14px;">contactless</span>
        <span class="font-caption text-[10px] text-on-surface-variant">EMV Contactless</span>
      </div>
      <span class="font-label-code-md text-[10px] text-secondary font-semibold">READY</span>
    </div>
  </div>

</div>
