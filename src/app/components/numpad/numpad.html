<div style="width:280px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:14px;height:100%;">
  
  <!-- Override / Qty -->
  <div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;">Qty / Override</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;justify-content:flex-end;margin-bottom:12px;">
    <span class="mono" style="font-size:20px;font-weight:700;color:var(--text);min-height:30px;line-height:1.2;">
      {{ pos.numBuffer() || '—' }}
    </span>
  </div>

  <!-- Numpad -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px;">
    <div *ngFor="let d of digits" class="nk" style="height:44px;" (click)="onKeyClick(d)">{{ d }}</div>
    
    <div class="nk nk-special" style="height:44px;" (click)="onClear()">CLR</div>
    <div class="nk" style="height:44px;" (click)="onKeyClick('0')">0</div>
    <div class="nk nk-special" style="height:44px;" (click)="onBackspace()">⌫</div>
  </div>

  <!-- Actions -->
  <div style="display:flex;flex-direction:column;gap:8px;">
    <button class="btn btn-ghost" style="justify-content:center;padding:10px;color:var(--accent);" (click)="onApplyQty()">
      ↳ Set Quantity
    </button>
    <button class="btn btn-ghost" style="justify-content:center;padding:10px;color:var(--amber);" (click)="onManualDiscount()">
      % Manual Discount
    </button>
    <button class="btn btn-danger" style="justify-content:center;padding:10px;" (click)="onRemoveItem()">
      ✕ Remove Item
    </button>
  </div>

  <!-- SESSION STATS (Bottom part of sidebar in original) -->
  <div style="margin-top:auto;">
    <div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;margin-top:16px;">Session Stats</div>
    
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;">
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px;">Cart Items</div>
        <div class="mono" style="font-size:18px;font-weight:700;">{{ pos.cart().length }}</div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px;">Sales Today</div>
        <div class="mono" style="font-size:14px;font-weight:700;color:var(--green);">₦{{ pos.sessionRevenue().toLocaleString() }}</div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px;">Transactions</div>
        <div class="mono" style="font-size:18px;font-weight:700;">{{ pos.sessionTxCount() }}</div>
      </div>
    </div>

    <!-- Held -->
    <div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">
      <span>Held</span>
      <span class="tag tag-dim mono">{{ pos.heldTxs().length }}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:100px;overflow-y:auto;" class="thin-scroll">
      <div *ngFor="let h of pos.heldTxs(); let i = index" 
           (click)="pos.recallHeld(i)"
           style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
        <span class="mono" style="font-size:10px;color:var(--accent);">{{ h.txNum }}</span>
        <span style="font-size:10px;color:var(--text2);">{{ h.items.length }} items</span>
      </div>
    </div>
  </div>
</div>
