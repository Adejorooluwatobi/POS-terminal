<div class="modal-overlay" (click)="cancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 *ngIf="isOpening()">🚀 Open New Till Session</h2>
      <h2 *ngIf="isClosing()">🏁 Close Till Session</h2>
      <button class="close-btn" (click)="cancel()">&times;</button>
    </div>

    <div class="modal-body">
      <!-- Opening Form -->
      <div *ngIf="isOpening()" class="form-group">
        <label for="openingFloat">Opening Float (Cash in Drawer)</label>
        <div class="input-wrapper">
          <span class="currency">₦</span>
          <input type="number" id="openingFloat" [(ngModel)]="openingFloat" placeholder="0.00" autoFocus>
        </div>
        <p class="help-text">Enter the initial cash amount available in the till.</p>
      </div>

      <!-- Closing Form -->
      <div *ngIf="isClosing()" class="form-group">
        <label for="closingCash">Closing Cash (Actual Count)</label>
        <div class="input-wrapper">
          <span class="currency">₦</span>
          <input type="number" id="closingCash" [(ngModel)]="closingCash" placeholder="0.00" autoFocus>
        </div>
        <p class="help-text">Count all cash in the drawer and enter the total.</p>
        
        <div class="session-summary" *ngIf="session()">
          <div class="summary-item">
            <span>Opened At:</span>
            <span>{{ session()?.openedAt | date:'short' }}</span>
          </div>
          <div class="summary-item">
            <span>Opening Float:</span>
            <span>₦{{ session()?.openingFloat | number:'1.2-2' }}</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Notes (Optional)</label>
        <textarea id="notes" [(ngModel)]="notes" placeholder="Any discrepancies or remarks..."></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="cancel()">Cancel</button>
      <button *ngIf="isOpening()" class="btn-primary" (click)="openTill()">
        Confirm & Open Till
      </button>
      <button *ngIf="isClosing()" class="btn-danger" (click)="closeTill()">
        Finalize & Close Till
      </button>
    </div>
  </div>
</div>
