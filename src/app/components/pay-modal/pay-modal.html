<div *ngIf="isOpen" class="modal-wrap">
  <div class="modal" style="max-width:440px; width:95%; margin: auto;">
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:14px;font-weight:700;">Payment</div>
        <div class="mono" style="font-size:10px;color:var(--text3);">TX: LG01-{{ pos.txCounter() | number:'3.0-0' }}</div>
      </div>
      <button (click)="closeModal()" class="btn btn-ghost btn-xs">✕</button>
    </div>
    <div style="padding:16px 18px;">
      <!-- Amount due -->
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;margin-bottom:14px;">
        <div style="font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Amount Due</div>
        <div class="mono" style="font-size:32px;font-weight:700;color:var(--green);">{{ fmt(pos.grandTotal()) }}</div>
      </div>
      <!-- Methods -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(80px, 1fr));gap:5px;margin-bottom:14px;">
        <button class="btn btn-xs" style="justify-content:center;" [class.btn-accent]="payMethod() === 'CASH'" [class.btn-ghost]="payMethod() !== 'CASH'" (click)="selPayMethod('CASH')">Cash</button>
        <button class="btn btn-xs" style="justify-content:center;" [class.btn-accent]="payMethod() === 'CARD'" [class.btn-ghost]="payMethod() !== 'CARD'" (click)="selPayMethod('CARD')">Card</button>
        <button class="btn btn-xs" style="justify-content:center;" [class.btn-accent]="payMethod() === 'MOBILE'" [class.btn-ghost]="payMethod() !== 'MOBILE'" (click)="selPayMethod('MOBILE')">Transfer</button>
        <button class="btn btn-xs" style="justify-content:center;" [class.btn-accent]="payMethod() === 'SPLIT'" [class.btn-ghost]="payMethod() !== 'SPLIT'" (click)="selPayMethod('SPLIT')">Split</button>
      </div>
      <!-- Cash section -->
      <div *ngIf="payMethod() === 'CASH' || payMethod() === 'SPLIT'">
        <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;">Tendered</div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:6px;padding:8px 12px;margin-bottom:8px;">
          <span class="mono" style="color:var(--accent);font-size:14px;">₦</span>
          <input [(ngModel)]="tendered" type="number" class="mono" style="background:none;border:none;outline:none;color:var(--text);font-size:18px;width:100%;">
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;">
          <button (click)="setTender(500)" class="btn btn-ghost btn-xs" style="flex:1;justify-content:center;">₦500</button>
          <button (click)="setTender(1000)" class="btn btn-ghost btn-xs" style="flex:1;justify-content:center;">₦1K</button>
          <button (click)="setTender(2000)" class="btn btn-ghost btn-xs" style="flex:1;justify-content:center;">₦2K</button>
          <button (click)="setTender(5000)" class="btn btn-ghost btn-xs" style="flex:1;justify-content:center;">₦5K</button>
          <button (click)="setExact()" class="btn btn-accent btn-xs" style="flex:1;justify-content:center;">Exact</button>
        </div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span style="font-size:12px;color:var(--text2);">Change</span>
          <span class="mono" style="font-size:18px;font-weight:700;color:var(--amber);">{{ fmt(change()) }}</span>
        </div>
      </div>
      <!-- Card/Mobile section -->
      <div *ngIf="payMethod() === 'CARD' || payMethod() === 'MOBILE'" style="text-align:center;padding:20px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;">
        <div style="font-size:28px;margin-bottom:8px;">{{ payMethod() === 'CARD' ? '💳' : '🏦' }}</div>
        <div style="font-size:12px;color:var(--text2);">{{ payMethod() === 'CARD' ? 'Present card to terminal' : 'Awaiting confirmation of bank transfer...' }}</div>
        <div class="mono" style="font-size:10px;color:var(--text3);margin-top:4px;">Awaiting gateway…</div>
      </div>
      <button (click)="processPayment()" class="btn btn-accent" style="width:100%;justify-content:center;font-size:14px;font-weight:700;padding:11px;border-radius:8px;">
        ✓ Confirm Payment
      </button>
    </div>
  </div>
</div>
