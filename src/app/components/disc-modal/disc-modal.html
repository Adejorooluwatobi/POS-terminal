<div *ngIf="isOpen" class="modal-wrap">
  <div class="modal" style="max-width:300px;">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:700;">Manual Discount</span>
      <button (click)="closeModal()" class="btn btn-ghost btn-xs">✕</button>
    </div>
    <div style="padding:14px 16px;">
      <div style="font-size:10px;color:var(--text3);margin-bottom:10px;" class="mono">Requires supervisor approval · Logged to audit trail</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;">
        <button class="btn btn-sm" [class.btn-accent]="discType() === 'pct'" [class.btn-ghost]="discType() !== 'pct'" (click)="onTypeSelect('pct')" style="justify-content:center;">% Off</button>
        <button class="btn btn-sm" [class.btn-accent]="discType() === 'fixed'" [class.btn-ghost]="discType() !== 'fixed'" (click)="onTypeSelect('fixed')" style="justify-content:center;">₦ Off</button>
      </div>
      <input [(ngModel)]="discValue" type="number" class="inp mono" placeholder="Enter value" style="margin-bottom:10px;font-size:15px;">
      <button (click)="onApply()" class="btn btn-amber" style="width:100%;justify-content:center;padding:9px;">Apply Discount</button>
    </div>
  </div>
</div>
