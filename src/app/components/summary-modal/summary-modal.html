<div *ngIf="isOpen" class="modal-wrap">
  <div class="modal" style="max-width:420px;">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:700;">Session Summary</span>
      <button (click)="closeModal()" class="btn btn-ghost btn-xs">✕</button>
    </div>
    <div style="padding:16px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;">
          <div style="font-size:10px;color:var(--text3);margin-bottom:3px;">Revenue</div>
          <div class="mono" style="font-size:18px;font-weight:700;color:var(--green);">{{ fmt(pos.sessionRevenue()) }}</div>
        </div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;">
          <div style="font-size:10px;color:var(--text3);margin-bottom:3px;">Transactions</div>
          <div class="mono" style="font-size:18px;font-weight:700;">{{ pos.sessionTxCount() }}</div>
        </div>
        <div *ngIf="auth.currentStaff() as staff" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;">
          <div style="font-size:10px;color:var(--text3);margin-bottom:3px;">Cashier</div>
          <div style="font-size:12px;font-weight:600;">{{ staff.name }}</div>
          <div style="font-size:10px;color:var(--text3);">{{ staff.id }} · {{ staff.role }}</div>
        </div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;">
          <div style="font-size:10px;color:var(--text3);margin-bottom:3px;">Opening Float</div>
          <div class="mono" style="font-size:18px;font-weight:700;color:var(--amber);">₦10,000.00</div>
        </div>
      </div>
      <div style="font-size:10px;color:var(--text3);margin-bottom:5px;">Avg. Transaction Value</div>
      <div class="mono" style="font-size:13px;font-weight:700;color:var(--text);">
        {{ pos.sessionTxCount() > 0 ? fmt(pos.sessionRevenue() / pos.sessionTxCount()) : '₦0.00' }}
      </div>
    </div>
  </div>
</div>
