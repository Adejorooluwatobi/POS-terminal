<div
  style="
    width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--surface);
    min-height: 0;
  "
>
  <!-- Search -->
  <div style="padding: 10px; border-bottom: 1px solid var(--border)">
    <div style="position: relative">
      <svg
        width="12"
        height="12"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        style="
          position: absolute;
          left: 9px;
          top: 50%;
          transform: translateY(-50%);
          color: var(--text3);
        "
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        class="inp"
        style="padding-left: 28px; font-size: 12px"
        placeholder="Search product name or SKU…"
        (input)="onSearch($event)"
      />
    </div>
  </div>

  <!-- Category tabs -->
  <div
    style="
      display: flex;
      gap: 4px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    "
    class="thin-scroll"
  >
    <button
      *ngFor="let cat of categories"
      class="cat-tab btn btn-xs"
      [class.btn-accent]="selectedCategory() === cat.id"
      [class.btn-ghost]="selectedCategory() !== cat.id"
      style="white-space: nowrap"
      (click)="filterCat(cat.id)"
    >
      {{ cat.name }}
    </button>
  </div>

  <!-- Products grid -->
  <div
    class="thin-scroll"
    style="
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      align-content: start;
    "
  >
    <div
      *ngFor="let p of filteredProducts()"
      class="prod-card fade-up hover-glow click-scale"
      (click)="onProductClick(p)"
    >
      <div style="font-size: 24px; text-align: center; margin-bottom: 6px">{{ p.emoji }}</div>
      <div style="font-size: 11px; font-weight: 600; line-height: 1.2; margin-bottom: 2px">
        {{ p.name }}
      </div>
      <div
        style="font-size: 10px; font-weight: 700; color: var(--green); margin-bottom: 4px"
        class="mono"
      >
        ₦{{ p.price.toLocaleString() }}
      </div>
      <div class="mono" style="font-size: 8px; color: var(--text3)">{{ p.sku }}</div>
      <div *ngIf="p.rollPrice || p.packPrice" style="position: absolute; top: 4px; right: 4px; font-size: 10px;">📦</div>
    </div>
  </div>

  <!-- Recently scanned -->
  <div style="padding: 8px; border-top: 1px solid var(--border); flex-shrink: 0">
    <div
      style="
        font-size: 10px;
        font-weight: 600;
        color: var(--text3);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 6px;
      "
    >
      Recently Scanned
    </div>
    <div style="display: flex; gap: 4px; flex-wrap: wrap">
      <button
        *ngFor="let p of pos.recentScanned()"
        (click)="onProductClick(p)"
        class="tag tag-dim"
        style="cursor: pointer; font-size: 10px; border: 1px solid var(--border)"
      >
        {{ p.emoji }} {{ p.sku }}
      </button>
      <div
        *ngIf="pos.recentScanned().length === 0"
        style="font-size: 9px; color: var(--text3); font-style: italic"
      >
        No items scanned yet
      </div>
    </div>
  </div>

  <!-- Unit Selection Modal -->
  <div *ngIf="unitSelectionProduct()" class="modal-backdrop" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000;">
    <div class="card fade-up" style="width: 300px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div style="font-weight: 700; font-size: 14px;">Select Unit</div>
        <button (click)="closeUnitSelection()" style="background: none; border: none; font-size: 20px; cursor: pointer;">&times;</button>
      </div>
      
      <div style="font-size: 12px; font-weight: 600; margin-bottom: 12px; color: var(--text2);">{{ unitSelectionProduct()?.name }}</div>

      <div style="display: grid; gap: 10px;">
        <button class="btn btn-secondary" style="justify-content: space-between; padding: 12px 15px;" (click)="selectUnitAndAdd('Single')">
          <span>Single</span>
          <span class="mono">₦{{ unitSelectionProduct()?.price?.toLocaleString() }}</span>
        </button>
        
        <button *ngIf="unitSelectionProduct()?.rollPrice" class="btn btn-secondary" style="justify-content: space-between; padding: 12px 15px;" (click)="selectUnitAndAdd('Roll')">
          <span>Roll ({{ unitSelectionProduct()?.singlesPerRoll || '?' }} singles)</span>
          <span class="mono">₦{{ unitSelectionProduct()?.rollPrice?.toLocaleString() }}</span>
        </button>
        
        <button *ngIf="unitSelectionProduct()?.packPrice" class="btn btn-accent" style="justify-content: space-between; padding: 12px 15px;" (click)="selectUnitAndAdd('Pack')">
          <span>Pack ({{ unitSelectionProduct()?.singlesPerPack || unitSelectionProduct()?.rollsPerPack || '?' }} singles)</span>
          <span class="mono">₦{{ unitSelectionProduct()?.packPrice?.toLocaleString() }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
