<header class="w-full bg-surface-container-lowest/95 backdrop-blur-xl border-b border-surface-container-high px-4 py-1.5 flex items-center justify-between gap-3 z-40 select-none shadow-sm">
  
  <!-- Left: Branding & Terminal Readiness -->
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-primary via-primary-container to-secondary flex items-center justify-center shadow-[0_0_12px_rgba(76,215,246,0.25)] shrink-0">
        <span class="material-symbols-outlined text-surface-container-lowest font-semibold text-[16px]" style="width:16px;height:16px;">point_of_sale</span>
      </div>
      <div class="flex flex-col">
        <div class="flex items-center gap-1.5">
          <span class="font-headline-md text-caption text-on-surface font-medium tracking-tight">{{ storeName() }}</span>
          <span class="px-1.5 py-0.2 rounded-full bg-secondary/15 text-secondary text-[10px] font-label-code-md font-medium tracking-wider">{{ terminalCode() }}</span>
        </div>
        <span class="text-[10px] font-label-code-md text-on-surface-variant flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
          ONLINE • READY
        </span>
      </div>
    </div>
  </div>

  <!-- Center / Action Shortcuts -->
  <div class="hidden lg:flex items-center gap-0.5 bg-surface-container-low/80 p-0.5 rounded-lg border border-surface-container-high/60 shadow-inner">
    <button (click)="openSessionSummary()" class="px-2.5 py-1 rounded-md text-on-surface-variant hover:text-on-surface font-body-md text-[10px] uppercase tracking-wider font-medium transition-all hover:bg-surface-container cursor-pointer flex items-center gap-1">
      <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">analytics</span>
      <span>Summary</span>
    </button>
    <button (click)="clickTill.emit()" class="px-2.5 py-1 rounded-md text-on-surface-variant hover:text-on-surface font-body-md text-[10px] uppercase tracking-wider font-medium transition-all hover:bg-surface-container cursor-pointer flex items-center gap-1">
      <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">lock_open</span>
      <span>Till Control</span>
    </button>
    <button (click)="clickGiftCard.emit()" class="px-2.5 py-1 rounded-md text-primary hover:text-primary-container font-body-md text-[10px] uppercase tracking-wider font-medium transition-all hover:bg-surface-container cursor-pointer flex items-center gap-1">
      <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">contactless</span>
      <span>Card Center</span>
    </button>
    <button (click)="clickHistory.emit()" class="px-2.5 py-1 rounded-md text-on-surface-variant hover:text-on-surface font-body-md text-[10px] uppercase tracking-wider font-medium transition-all hover:bg-surface-container cursor-pointer flex items-center gap-1">
      <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">history</span>
      <span>History</span>
    </button>
    <button (click)="clickCalculator.emit()" class="px-2 py-1 rounded-md text-on-surface-variant hover:text-on-surface font-body-md text-[10px] transition-all hover:bg-surface-container cursor-pointer flex items-center" title="Calculator">
      <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">calculate</span>
    </button>
  </div>

  <!-- Right: Operational Badges, Clock & Cashier -->
  <div class="flex items-center gap-2">
    <!-- Till Status Chip -->
    <button (click)="clickTill.emit()" 
            class="flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-label-code-md font-medium cursor-pointer border transition-colors"
            [class.bg-secondary-container/20]="isTillOpen()"
            [class.text-secondary]="isTillOpen()"
            [class.border-secondary/30]="isTillOpen()"
            [class.bg-surface-container]="!isTillOpen()"
            [class.text-outline]="!isTillOpen()"
            [class.border-surface-container-high]="!isTillOpen()">
      <span class="w-1.5 h-1.5 rounded-full" [class.bg-secondary]="isTillOpen()" [class.bg-outline]="!isTillOpen()"></span>
      <span>Till: {{ isTillOpen() ? 'Open' : 'Closed' }}</span>
    </button>

    <!-- Digital Monospaced Clock -->
    <div class="font-label-code-md text-[10px] font-medium text-primary tracking-wider bg-surface-container border border-surface-container-high px-2 py-0.5 rounded-md">
      {{ clock() }}
    </div>

    <!-- Cashier Profile Pill -->
    <div class="flex items-center gap-1.5 bg-surface-container-low border border-surface-container-high px-2 py-0.5 rounded-lg">
      <div class="w-6 h-6 rounded-md bg-primary-container/30 text-primary flex items-center justify-center font-semibold text-[10px]">
        {{ staffInitials() }}
      </div>
      <div class="flex flex-col text-left">
        <span class="text-[11px] font-medium leading-tight text-on-surface">{{ staffName() }}</span>
        <span class="text-[9px] font-caption text-on-surface-variant uppercase tracking-wider leading-none">{{ staffRole() }}</span>
      </div>
    </div>

    <!-- Theme Toggle -->
    <button (click)="toggleTheme()" class="w-7 h-7 rounded-lg bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer border border-surface-container-high" title="Toggle Theme">
      <span class="material-symbols-outlined text-[15px]" style="width:15px;height:15px;">dark_mode</span>
    </button>

    <!-- End Shift CTA -->
    <button (click)="confirmLogout()" class="px-2 py-0.5 rounded-md bg-error-container/30 hover:bg-error-container text-error text-[10px] font-body-md font-medium transition-colors cursor-pointer border border-error/30" title="End Shift & Sign Out">
      End Shift
    </button>
  </div>

</header>
