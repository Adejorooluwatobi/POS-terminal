<div style="flex:1;display:flex;flex-direction:column;width:100%;background:var(--bg);overflow:hidden;min-height:0;">
  
  <app-header 
    (clickSummary)="openSummaryModal()"
    (clickCalculator)="showCalculator.set(true)">
  </app-header>

  <div style="flex:1;display:flex;overflow:hidden;width:100%;min-height:0;">
    
    <!-- Left: Product Browser -->
    <app-product-browser style="display:flex;flex-direction:column;flex-shrink:0;height:100%;"></app-product-browser>

    <!-- Center: Transaction -->
    <app-transaction-cart 
        style="flex:1;display:flex;flex-direction:column;height:100%;"
        (clickCharge)="openPayModal()"
        (clickCustomer)="openCustomerModal()">
    </app-transaction-cart>

    <!-- Right: Numpad + Controls -->
    <app-numpad 
        style="display:flex;flex-direction:column;flex-shrink:0;height:100%;"
        (clickDiscount)="openDiscModal()">
    </app-numpad>

  </div>

  <!-- Modals -->
  <app-pay-modal 
    [isOpen]="showPayModal()" 
    (close)="closePayModal()"
    (paymentSuccess)="onPaymentSuccess()">
  </app-pay-modal>

  <app-receipt-modal 
    [isOpen]="showReceiptModal()" 
    (close)="closeReceiptModal()"
    (newTransaction)="startNewTransaction()">
  </app-receipt-modal>

  <app-customer-modal 
    [isOpen]="showCustomerModal()" 
    (close)="closeCustomerModal()">
  </app-customer-modal>

  <app-disc-modal 
    [isOpen]="showDiscModal()" 
    (close)="closeDiscModal()">
  </app-disc-modal>

  <app-summary-modal 
    [isOpen]="showSummaryModal()" 
    (close)="closeSummaryModal()">
  </app-summary-modal>

  <app-calculator 
    [isOpen]="showCalculator()" 
    (close)="showCalculator.set(false)">
  </app-calculator>

  <app-toast-container></app-toast-container>

</div>
