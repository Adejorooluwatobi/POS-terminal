<div class="fixed inset-0 flex items-center justify-center" style="background:var(--bg);">
  <div style="width:340px;">
    <!-- Terminal badge -->
    <div style="text-align:center;margin-bottom:28px;">
      <div style="display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 12px;margin-bottom:16px;">
        <span class="scanner-dot"></span>
        <span class="mono" style="font-size:10px;color:var(--text3);">TERMINAL · LG-01-T3</span>
        <span class="tag tag-dim" style="margin-left:2px;">VI Store</span>
      </div>
      <div style="font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--text);">RetailOS</div>
      <div class="mono" style="font-size:10px;color:var(--text3);margin-top:3px;letter-spacing:.06em;">POINT OF SALE · v2.4</div>
    </div>

    <!-- Login card -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;">
      <!-- Staff selector -->
      <div style="padding:16px 18px;border-bottom:1px solid var(--border);">
        <div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;">Select Staff</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          <div *ngFor="let s of auth.staffList()" 
               (click)="auth.selectStaff(s.id)"
               class="flex items-center gap-[6px] p-[7px] px-[9px] rounded-[7px] border border-[var(--border)] bg-[var(--surface2)] cursor-pointer transition-all duration-120 hover:border-[var(--border2)]"
               [style.border-color]="auth.selectedStaffId() === s.id ? s.color + '88' : 'var(--border)'"
               [style.background]="auth.selectedStaffId() === s.id ? s.color + '11' : 'var(--surface2)'">
            <div [style.background]="s.color + '22'" [style.border-color]="s.color + '55'" [style.color]="s.color"
                 class="w-[26px] h-[26px] rounded-full border-[1.5px] flex items-center justify-center text-[10px] font-bold shrink-0">
              {{ s.initials }}
            </div>
            <div style="overflow:hidden;">
              <div style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ s.name.split(' ')[0] }}</div>
              <div style="font-size:8px;color:var(--text3);">{{ s.role }}</div>
            </div>
          </div>
        </div>
      </div>

      <!-- PIN area -->
      <div style="padding:16px 18px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;">Enter PIN</div>
          <div style="font-size:11px;color:var(--accent);font-weight:600;">{{ auth.getStaff(auth.selectedStaffId() || '')?.name || '' }}</div>
        </div>

        <!-- PIN display -->
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div style="display:flex;gap:10px;">
            <div *ngFor="let i of [0,1,2,3]" 
                 class="pin-dot" 
                 style="width:10px;height:10px;border-radius:50%;border:1.5px solid var(--border2);transition:all .1s;"
                 [style.background]="pin().length > i ? 'var(--accent)' : 'transparent'"
                 [style.border-color]="pin().length > i ? 'var(--accent)' : 'var(--border2)'">
            </div>
          </div>
          <div class="mono" style="font-size:18px;letter-spacing:4px;color:var(--text);flex:1;text-align:center;">
             {{ '●'.repeat(pin().length) }}
          </div>
          <button (click)="pinBackspace()" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;">⌫</button>
        </div>

        <!-- PIN numpad -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;">
          <div *ngFor="let d of ['1','2','3','4','5','6','7','8','9']" 
               class="nk" style="height:38px;" (click)="pinInput(d)">{{ d }}</div>
          <div class="nk nk-special" style="height:38px;" (click)="pinClear()">CLR</div>
          <div class="nk" style="height:38px;" (click)="pinInput('0')">0</div>
          <div class="nk nk-action" style="height:38px;" (click)="attemptLogin()">→</div>
        </div>
      </div>
    </div>

    <!-- Theme toggle -->
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;">
      <span style="font-size:10px;color:var(--text3);">☀</span>
      <div class="theme-toggle" (click)="toggleTheme()"><div class="knob"></div></div>
      <span style="font-size:10px;color:var(--text3);">☾</span>
    </div>
    <div class="mono" style="text-align:center;margin-top:8px;font-size:10px;color:var(--text3);">Demo PIN for any staff: 1234</div>
  </div>
</div>
