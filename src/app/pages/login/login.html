<div class="min-h-screen w-full flex items-center justify-center bg-background px-4 py-8 select-none overflow-y-auto">
  <div class="w-full max-w-sm flex flex-col items-center">
    
    <!-- Top Branding & Terminal Badge -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 bg-surface-container border border-surface-container-high rounded-full px-3 py-1 mb-3 shadow-inner">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-secondary"></span>
        </span>
        <span class="font-label-code-md text-[11px] text-on-surface-variant uppercase tracking-wider font-semibold">TERMINAL · {{ terminalCode() }}</span>
        <span class="text-outline">•</span>
        <span class="font-caption text-[11px] text-secondary font-semibold">READY</span>
      </div>
      <h1 class="font-headline-lg text-headline-lg tracking-tight text-on-surface font-bold">RetailOS</h1>
      <p class="font-label-code-md text-caption text-primary tracking-widest uppercase mt-0.5">Point of Sale Workstation</p>
    </div>

    <!-- Login Obsidian Card -->
    <div class="w-full bg-surface-container-low border border-surface-container-high rounded-2xl overflow-hidden shadow-2xl relative">
      <!-- Glow ambient backdrop -->
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-primary/10 rounded-full blur-2xl pointer-events-none"></div>

      <!-- Store & Employee Info Header -->
      <div class="p-5 border-b border-surface-container-high bg-surface-container-lowest/60">
        <!-- Store Location Chip -->
        <div class="mb-3">
          <span class="font-caption text-[10px] font-bold text-outline uppercase tracking-wider block mb-1">Assigned Store Location</span>
          <div class="flex items-center gap-2.5 bg-surface-container border border-surface-container-high/80 rounded-xl px-3 py-2">
            <div class="w-7 h-7 rounded-lg bg-primary-container/20 text-primary flex items-center justify-center">
              <span class="material-symbols-outlined text-[16px]" style="width:16px;height:16px;">storefront</span>
            </div>
            <div class="flex-1 min-w-0">
              <span class="font-body-md text-caption font-bold text-on-surface block truncate">{{ storeName() }}</span>
              <span class="font-label-code-md text-[10px] text-on-surface-variant block truncate">ID: {{ storeId() || 'ST-DEFAULT-01' }}</span>
            </div>
          </div>
        </div>

        <!-- Employee ID Input -->
        <div>
          <label class="font-caption text-[10px] font-bold text-outline uppercase tracking-wider block mb-1">Employee Number</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-primary text-[18px]" style="width:18px;height:18px;">badge</span>
            <input 
              #empInputRef
              id="employeeNoInput"
              [(ngModel)]="employeeNo" 
              (keydown.enter)="onEmployeeEnter()"
              class="w-full bg-surface-container border border-surface-container-high rounded-xl pl-9 pr-3 py-2.5 font-label-code-md text-body-md text-on-surface font-semibold placeholder:text-outline/50 focus:outline-none focus:border-primary focus:shadow-[0_0_12px_rgba(76,215,246,0.25)] transition-all" 
              placeholder="e.g. EMP-001"
              autocomplete="off"
            />
          </div>
        </div>
      </div>

      <!-- PIN Input Area -->
      <div class="p-5 transition-all duration-200" 
           [class.opacity-40]="!isInputReady()" 
           [class.pointer-events-none]="!isInputReady()">
        
        <div class="flex items-center justify-between mb-3 text-caption text-outline">
          <span class="font-caption text-[10px] font-bold uppercase tracking-widest">Enter 4-Digit Access PIN</span>
          <span class="font-caption text-[10px] text-primary flex items-center gap-1 font-semibold">
            <span class="material-symbols-outlined text-[12px]" style="width:12px;height:12px;">keyboard</span>
            Keypad or Typing
          </span>
        </div>

        <!-- 4-Digit Display Indicator with Direct Keyboard Support -->
        <div class="relative bg-surface-container-lowest border border-surface-container-high rounded-xl p-3 flex items-center justify-between mb-4 shadow-inner cursor-pointer"
             (click)="focusPinInput()">
          <input
            #pinInputRef
            id="hiddenPinInput"
            type="password"
            inputmode="numeric"
            maxlength="4"
            [value]="pin()"
            (input)="onPinInputChange($event)"
            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
            aria-label="4-digit access pin"
          />
          <div class="flex items-center gap-3 pl-2 pointer-events-none">
            <div *ngFor="let i of [0, 1, 2, 3]" 
                 class="w-3.5 h-3.5 rounded-full border-2 transition-all duration-150"
                 [class.bg-primary]="pin().length > i"
                 [class.border-primary]="pin().length > i"
                 [class.shadow-[0_0_10px_rgba(76,215,246,0.6)]]="pin().length > i"
                 [class.border-surface-container-highest]="pin().length <= i"
                 [class.bg-transparent]="pin().length <= i">
            </div>
          </div>
          <button type="button" (click)="pinBackspace(); $event.stopPropagation()" class="p-1 rounded text-on-surface-variant hover:text-error transition-colors cursor-pointer z-20" title="Backspace">
            <span class="material-symbols-outlined text-[18px]" style="width:18px;height:18px;">backspace</span>
          </button>
        </div>

        <!-- Error Feedback Banner -->
        <div *ngIf="error()" class="mb-3 p-2 rounded-lg bg-error-container/40 border border-error/30 text-error text-center font-caption text-[11px] font-semibold animate-fade-in">
          {{ error() }}
        </div>

        <!-- Tactile 3x4 Touch Keypad -->
        <div class="grid grid-cols-3 gap-2">
          <button *ngFor="let d of ['1','2','3','4','5','6','7','8','9']" 
                  (click)="pinInput(d)"
                  [disabled]="isLoading()"
                  class="h-12 rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 text-on-surface font-label-numeric-keypad text-headline-md flex items-center justify-center border border-surface-container-highest shadow-sm transition-all cursor-pointer">
            {{ d }}
          </button>
          <button (click)="pinClear()" 
                  [disabled]="isLoading()"
                  class="h-12 rounded-xl bg-surface-container-low hover:bg-error-container/30 text-error font-headline-md text-caption uppercase font-bold flex items-center justify-center border border-surface-container-highest shadow-sm transition-all cursor-pointer">
            CLR
          </button>
          <button (click)="pinInput('0')" 
                  [disabled]="isLoading()"
                  class="h-12 rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-95 text-on-surface font-label-numeric-keypad text-headline-md flex items-center justify-center border border-surface-container-highest shadow-sm transition-all cursor-pointer">
            0
          </button>
          <button (click)="attemptLogin()" 
                  [disabled]="isLoading() || pin().length < 4"
                  class="h-12 rounded-xl bg-primary hover:bg-primary-container text-on-primary font-headline-md flex items-center justify-center shadow-[0_0_15px_rgba(76,215,246,0.3)] transition-all cursor-pointer disabled:opacity-50">
            <span *ngIf="!isLoading()" class="material-symbols-outlined text-[20px]" style="width:20px;height:20px;">arrow_forward</span>
            <span *ngIf="isLoading()" class="material-symbols-outlined text-[20px] animate-spin" style="width:20px;height:20px;">sync</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="flex items-center justify-between w-full mt-4 px-2">
      <button (click)="goToPairing()" class="font-caption text-[11px] text-on-surface-variant hover:text-primary flex items-center gap-1 transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">link</span>
        <span>Re-link Workstation</span>
      </button>

      <button (click)="themeService.toggleTheme()" class="font-caption text-[11px] text-on-surface-variant hover:text-primary flex items-center gap-1 transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-[14px]" style="width:14px;height:14px;">dark_mode</span>
        <span>Toggle Theme</span>
      </button>
    </div>

  </div>
</div>
