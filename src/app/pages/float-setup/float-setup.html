<div class="min-h-screen w-full flex items-center justify-center bg-background px-4 py-8 select-none overflow-y-auto">
  <div class="w-full max-w-sm">
    <div class="bg-surface-container-low border border-surface-container-high rounded-2xl p-6 shadow-2xl relative overflow-hidden">
      <!-- Glow ambient backdrop -->
      <div class="absolute -top-16 -right-16 w-36 h-36 bg-secondary/10 rounded-full blur-2xl pointer-events-none"></div>

      <!-- Header -->
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="flex items-center gap-1.5 mb-1">
            <span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
            <span class="font-caption text-[10px] text-secondary font-bold uppercase tracking-widest">SESSION INITIALIZATION</span>
          </div>
          <h2 class="font-headline-md text-headline-md text-on-surface font-bold">Open Till</h2>
        </div>
        <div class="w-10 h-10 rounded-xl bg-surface-container-high flex items-center justify-center text-primary shadow-inner">
          <span class="material-symbols-outlined text-[22px]" style="width:22px;height:22px;">payments</span>
        </div>
      </div>
      
      <p class="font-body-md text-caption text-on-surface-variant mb-4">
        Count the physical cash in the drawer and specify the opening float.
      </p>

      <!-- Active Staff Badge -->
      <div *ngIf="auth.currentStaff() as staff" class="flex items-center gap-3 bg-surface-container border border-surface-container-high rounded-xl p-3 mb-5 shadow-inner">
        <div class="w-9 h-9 rounded-xl bg-primary-container/30 text-primary flex items-center justify-center font-bold text-caption shadow-sm">
          {{ staff.initials }}
        </div>
        <div class="flex flex-col min-w-0">
          <span class="font-body-md text-caption font-bold text-on-surface truncate">{{ staff.name }}</span>
          <span class="font-label-code-md text-[10px] text-on-surface-variant uppercase tracking-wider">{{ staff.role }} · {{ staff.store || 'Active Store' }}</span>
        </div>
      </div>

      <!-- Opening Float Input -->
      <div class="mb-3">
        <label class="font-caption text-[10px] font-bold text-outline uppercase tracking-wider block mb-1.5">Opening Float Amount (₦)</label>
        <div class="relative flex items-center bg-surface-container-lowest border border-surface-container-high rounded-xl px-3.5 py-2.5 focus-within:border-secondary focus-within:shadow-[0_0_12px_rgba(78,222,163,0.25)] transition-all">
          <span class="font-label-code-md text-body-lg text-secondary font-bold mr-2">₦</span>
          <input 
            class="w-full bg-transparent font-label-code-lg text-headline-md text-on-surface font-bold focus:outline-none placeholder:text-outline/40" 
            type="number" 
            [(ngModel)]="floatValue"
            (keydown.enter)="openTill()"
            placeholder="0"
            autofocus
          >
        </div>
      </div>

      <!-- Quick Amount Presets -->
      <div class="grid grid-cols-4 gap-1.5 mb-6">
        <button (click)="setPreset(5000)" class="py-1.5 px-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-code-md text-[11px] font-semibold transition-colors cursor-pointer border border-surface-container-highest">
          5k
        </button>
        <button (click)="setPreset(10000)" class="py-1.5 px-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-code-md text-[11px] font-semibold transition-colors cursor-pointer border border-surface-container-highest">
          10k
        </button>
        <button (click)="setPreset(20000)" class="py-1.5 px-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-code-md text-[11px] font-semibold transition-colors cursor-pointer border border-surface-container-highest">
          20k
        </button>
        <button (click)="setPreset(50000)" class="py-1.5 px-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-code-md text-[11px] font-semibold transition-colors cursor-pointer border border-surface-container-highest">
          50k
        </button>
      </div>

      <!-- Primary Action CTA -->
      <button (click)="openTill()" 
              [disabled]="isSubmitting() || floatValue() < 0"
              class="w-full py-3.5 px-4 rounded-xl bg-secondary hover:bg-secondary-container text-on-secondary font-headline-md text-body-md font-bold tracking-wide shadow-[0_0_20px_rgba(78,222,163,0.35)] hover:shadow-[0_0_28px_rgba(78,222,163,0.55)] transition-all active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50">
        <span *ngIf="!isSubmitting()" class="material-symbols-outlined text-[20px]" style="width:20px;height:20px;">lock_open</span>
        <span *ngIf="isSubmitting()" class="material-symbols-outlined text-[20px] animate-spin" style="width:20px;height:20px;">sync</span>
        <span>{{ isSubmitting() ? 'Opening Till...' : 'Open Till & Begin Shift' }}</span>
        <span *ngIf="!isSubmitting()" class="material-symbols-outlined text-[18px]" style="width:18px;height:18px;">arrow_forward</span>
      </button>

    </div>
  </div>
</div>
